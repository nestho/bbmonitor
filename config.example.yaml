data_dir: "./data"
db_path: "./data/bbmonitor.db"
export_dir: "./data/exports"
interval: 10m
workers: 6

# Two layers:
#  - programs: platform program lists + scopes
#  - inventory: domains / wildcards / .gov / host indexes
sources:
  arkadiyt: true          # programs + scopes (H1/BC/Intigriti/YWH/Federacy)
  projectdiscovery: true  # programs + domains
  diodb: true             # VDP/BB program list
  rix4uni: true           # programs + domains
  orgsdata: true          # program → GitHub org mapping
  dotgov: true            # US .gov domain inventory (CISA)

notify:
  enabled: true
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""
  webhook:
    enabled: false
    url: ""
    headers: {}

log_level: info
mode: tui
