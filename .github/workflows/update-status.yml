name: Update status

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:        # manual run from Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record last update time
        run: |
          mkdir -p docs
          date -u "+%Y-%m-%d %H:%M:%S UTC" > docs/last-updated.txt
          echo "Status page last refreshed by GitHub Actions" >> docs/last-updated.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/last-updated.txt
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh status timestamp [skip ci]"
            git push
          fi
