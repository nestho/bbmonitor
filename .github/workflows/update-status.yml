name: Update status page data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Placeholder – future data refresh
        run: |
          echo "This workflow is a placeholder for future automated data export / status updates."
          date -u > docs/last-updated.txt

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/last-updated.txt || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update status timestamp" && git push)
