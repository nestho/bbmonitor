name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Resolve modules
        run: go mod tidy

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi
          OUT="bbmonitor_${{ matrix.goos }}_${{ matrix.goarch }}${EXT}"
          mkdir -p dist
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.event.inputs.version || github.ref_name }}" -o "dist/${OUT}" ./cmd/bbmonitor
          cd dist && sha256sum "${OUT}" > "${OUT}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: bbmonitor-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -la release/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: ${{ github.event.inputs.version || github.ref_name }}
          body: |
            ## bbmonitor ${{ github.event.inputs.version || github.ref_name }}

            Production-ready bug bounty scope & inventory monitor.

            ### Binaries
            | File | Platform |
            |------|----------|
            | `bbmonitor_linux_amd64` | Linux x86_64 |
            | `bbmonitor_linux_arm64` | Linux ARM64 |
            | `bbmonitor_windows_amd64.exe` | Windows x86_64 |
            | `bbmonitor_windows_arm64.exe` | Windows ARM64 |
            | `bbmonitor_darwin_amd64` | macOS Intel |
            | `bbmonitor_darwin_arm64` | macOS Apple Silicon |

            Each binary has a matching `.sha256` checksum file.

            See [CHANGELOG.md](https://github.com/nestho/bbmonitor/blob/main/CHANGELOG.md) for details.
          files: release/*
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
